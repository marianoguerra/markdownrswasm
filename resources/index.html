<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>markdownrswasm demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --border: #ccc;
        --muted: #666;
        --accent: #2b7cff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
      }
      header p {
        margin: 0 0 0.5rem 0;
      }
      .controls {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .tabs {
        display: flex;
        gap: 0.25rem;
      }
      .tab-btn {
        padding: 0.35rem 0.75rem;
        border: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
        font: inherit;
        color: inherit;
        border-radius: 4px;
      }
      .tab-btn.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .tab-panel {
        display: none;
        flex: 1;
        min-height: 0;
      }
      .tab-panel.active {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: auto 1fr;
      }
      .tab-panel .stats {
        grid-column: 1 / -1;
        padding: 0.35rem 0.75rem;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        font-variant-numeric: tabular-nums;
      }
      .tab-panel .editor,
      .tab-panel .preview {
        padding: 0.75rem;
        overflow: auto;
        min-width: 0;
      }
      .tab-panel .editor {
        display: flex;
      }
      .tab-panel .divider {
        border-right: 1px solid var(--border);
      }
      textarea {
        flex: 1;
        width: 100%;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        padding: 0.5rem;
        resize: none;
      }
      .preview :first-child,
      md-view > :first-child {
        margin-top: 0;
      }
      pre {
        background: rgba(127, 127, 127, 0.15);
        padding: 0.5rem;
        overflow-x: auto;
      }
      code {
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <p>
        Edit markdown on the left — the rendered output appears on the right.
      </p>
      <div class="controls">
        <label for="example">Example:</label>
        <select id="example"></select>
        <div class="tabs" role="tablist">
          <button type="button" class="tab-btn" data-tab="fn">Function</button>
          <button type="button" class="tab-btn" data-tab="wc">Web Component</button>
        </div>
      </div>
    </header>
    <main>
      <section class="tab-panel" data-tab="fn">
        <div class="stats" id="stats-fn">—</div>
        <div class="editor">
          <textarea id="input-fn" spellcheck="false"></textarea>
        </div>
        <div class="divider"></div>
        <div class="preview" id="preview-fn"></div>
      </section>
      <section class="tab-panel" data-tab="wc">
        <div class="stats" id="stats-wc">—</div>
        <div class="editor">
          <textarea id="input-wc" spellcheck="false"></textarea>
        </div>
        <div class="divider"></div>
        <md-view class="preview" id="preview-wc"></md-view>
      </section>
    </main>
    <script type="module" src="./usageexample.js"></script>
  </body>
</html>
