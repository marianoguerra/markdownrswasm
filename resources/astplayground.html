<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>markdownrswasm — AST playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --border: #ccc;
        --muted: #666;
        --accent: #2b7cff;
        --bad: #e0533d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        margin: 0 0 0.5rem;
        font-size: 1.05rem;
      }
      header p {
        margin: 0 0 0.5rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .controls {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .modes {
        display: flex;
        gap: 0.25rem;
      }
      .mode-btn {
        padding: 0.35rem 0.75rem;
        border: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
        font: inherit;
        color: inherit;
        border-radius: 4px;
      }
      .mode-btn.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      select {
        font: inherit;
        padding: 0.3rem 0.5rem;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        border-radius: 4px;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }
      .stats {
        grid-column: 1 / -1;
        padding: 0.4rem 1rem;
        border-bottom: 1px solid var(--border);
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .stats.error {
        color: var(--bad);
      }
      .editor,
      .output {
        padding: 0.75rem;
        overflow: auto;
        min-width: 0;
      }
      .editor {
        display: flex;
      }
      .divider {
        border-right: 1px solid var(--border);
      }
      textarea {
        flex: 1;
        width: 100%;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        padding: 0.5rem;
        resize: none;
      }
      pre.json {
        margin: 0;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>AST playground — markdown to JSON</h1>
      <p>
        Edit markdown on the left; the JSON output appears on the right.
        <b>Whole tree</b> calls <code>mdToAst</code> (the full mdast tree).
        <b>Top-level sections</b> calls <code>mdToTopLevel</code> (a tree of
        sections nested by heading depth, body blocks kept as raw markdown).
      </p>
      <div class="controls">
        <label for="example">Example:</label>
        <select id="example"></select>
        <div class="modes" role="group" aria-label="output mode">
          <button type="button" class="mode-btn" data-mode="ast">
            Whole tree
          </button>
          <button type="button" class="mode-btn" data-mode="top">
            Top-level sections
          </button>
        </div>
      </div>
    </header>
    <main>
      <div class="stats" id="stats">—</div>
      <div class="editor">
        <textarea id="input" spellcheck="false"></textarea>
      </div>
      <div class="divider"></div>
      <div class="output"><pre class="json" id="output"></pre></div>
    </main>
    <script type="module" src="./astplayground.js"></script>
  </body>
</html>
